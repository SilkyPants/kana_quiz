name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# Grant write access so the deploy job can push to gh-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; cancel in-progress runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Run unit & widget tests (Ubuntu is fast & free)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  # ─────────────────────────────────────────────────────────────────
  # 2. Build Windows Desktop release executable
  # ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          $dst = "kana-quiz-master-windows"
          New-Item -ItemType Directory -Path $dst | Out-Null
          Copy-Item -Recurse "$src\*" $dst
          Compress-Archive -Path $dst -DestinationPath "kana-quiz-master-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kana-quiz-master-windows
          path: kana-quiz-master-windows.zip
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 3. Build Flutter Web and upload as GitHub Pages artifact
  # ─────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        # --base-href must match the GitHub Pages sub-path:
        # https://<username>.github.io/<repository>/
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ─────────────────────────────────────────────────────────────────
  # 4. Deploy to GitHub Pages (main branch only)
  # ─────────────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
